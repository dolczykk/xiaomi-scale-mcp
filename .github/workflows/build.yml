name: 'build'
on:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  docker:
    name: Build ${{ matrix.platform }} Docker image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export image digest
        shell: bash
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish multi-architecture Docker image
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create and push multi-architecture manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
  binaries:
    name: Build ${{ matrix.target }} binary
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build release binary
        run: cargo build --release --package xiaomi_scale_mcp
      - name: Package release archive
        shell: bash
        run: |
          package_name="xiaomi-scale-mcp-${{ matrix.target }}"
          mkdir -p "dist/$package_name"
          cp target/release/xiaomi_scale_mcp "dist/$package_name/"
          cp config.example.toml "dist/$package_name/"
          tar -C dist -czf "dist/$package_name.tar.gz" "$package_name"
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-scale-mcp-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: xiaomi-scale-mcp-*
          path: dist
          merge-multiple: true
      - name: Generate checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
