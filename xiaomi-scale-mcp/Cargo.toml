[package]
name = "xiaomi_scale_mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
flexi_logger = "0.31"
log = "0.4"
rmcp = { version = "3.1.0", features = [ "server", "macros", "transport-streamable-http-server" ] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
xiaomi-client = { path = "../xiaomi-client" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
surrealdb = { version = "3.2.4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
axum = "0.8.9"
keyring = "4.1.6"
rpassword = "7.5.4"
subtle = "2.6.1"
tempfile = "3.27.0"
toml = "1.1.4"
zeroize = "1.9.0"
