[package]
name = "xiaomi-client"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
rust-version = "1.90.0"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.0.35"
md5 = "0.8.1"
rand = "0.10.2"
rc4 = "0.2.0"
reqwest = { version = "0.13.4", features = ["cookies", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
